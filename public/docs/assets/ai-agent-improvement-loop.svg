<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Talent Pilot AI agent improvement loop</title>
  <desc id="desc">A governed feedback loop where an AI agent run is reviewed by a human, evaluated for repeated issues, approved by a human owner, and released as a new version.</desc>
  <defs>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#596579"/>
    </marker>
    <style>
      .title { font: 800 38px "Inter", "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 18px "Inter", "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .step-label { font: 800 13px "Inter", "Segoe UI", Arial, sans-serif; fill: #64748b; letter-spacing: .08em; }
      .card-title { font: 800 22px "Inter", "Segoe UI", Arial, sans-serif; fill: #111827; }
      .card-text { font: 500 15px "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; }
      .rule-title { font: 800 18px "Inter", "Segoe UI", Arial, sans-serif; fill: #111827; }
      .rule-text { font: 500 16px "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; }
      .pill-text { font: 800 13px "Inter", "Segoe UI", Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="640" rx="32" fill="#f8fafc"/>
  <rect x="26" y="26" width="1228" height="588" rx="28" fill="#ffffff" stroke="#d9e2ef"/>

  <text class="step-label" x="70" y="88">GOVERNED IMPROVEMENT LOOP</text>
  <text class="title" x="70" y="132">AI agents improve when feedback becomes controlled changes</text>
  <text class="subtitle" x="70" y="166">The evaluator can suggest improvements, but production behavior changes only after human approval.</text>

  <path d="M312 318 H393" stroke="#596579" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M560 318 H641" stroke="#596579" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M808 318 H889" stroke="#596579" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1044 406 C900 542 380 542 218 428" stroke="#596579" stroke-width="4" stroke-dasharray="12 12" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="70" y="226" width="242" height="184" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="105" cy="267" r="17" fill="#2563eb"/>
    <text class="pill-text" x="100" y="272">1</text>
    <text class="card-title" x="134" y="273">Agent run</text>
    <text class="card-text" x="96" y="316">Drafts, ranks, parses,</text>
    <text class="card-text" x="96" y="340">summarizes, or explains</text>
    <text class="card-text" x="96" y="364">inside fixed guardrails.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="394" y="226" width="166" height="184" rx="22" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="429" cy="267" r="17" fill="#16a34a"/>
    <text class="pill-text" x="424" y="272">2</text>
    <text class="card-title" x="458" y="273">Human</text>
    <text class="card-title" x="458" y="300">review</text>
    <text class="card-text" x="420" y="340">User edits,</text>
    <text class="card-text" x="420" y="364">accepts, rejects,</text>
    <text class="card-text" x="420" y="388">or rates output.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="642" y="226" width="166" height="184" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <circle cx="677" cy="267" r="17" fill="#f97316"/>
    <text class="pill-text" x="672" y="272">3</text>
    <text class="card-title" x="706" y="273">Evaluator</text>
    <text class="card-text" x="668" y="316">Finds repeated</text>
    <text class="card-text" x="668" y="340">issues in prompts,</text>
    <text class="card-text" x="668" y="364">data, retrieval,</text>
    <text class="card-text" x="668" y="388">and scoring.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="890" y="226" width="270" height="184" rx="22" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <circle cx="925" cy="267" r="17" fill="#7c3aed"/>
    <text class="pill-text" x="920" y="272">4</text>
    <text class="card-title" x="954" y="273">Approved version</text>
    <text class="card-text" x="916" y="316">A prompt, rubric, rule,</text>
    <text class="card-text" x="916" y="340">retrieval setting, or data</text>
    <text class="card-text" x="916" y="364">fix is released as a</text>
    <text class="card-text" x="916" y="388">tracked new version.</text>
  </g>

  <rect x="70" y="470" width="1090" height="88" rx="20" fill="#f1f5f9" stroke="#d9e2ef"/>
  <circle cx="106" cy="514" r="18" fill="#0f766e"/>
  <path d="M98 514 L104 520 L116 506" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text class="rule-title" x="138" y="508">Control rule</text>
  <text class="rule-text" x="138" y="536">AI suggests improvements. Humans approve them. Backend guardrails still enforce permissions, review, audit, and workflow boundaries.</text>
</svg>
