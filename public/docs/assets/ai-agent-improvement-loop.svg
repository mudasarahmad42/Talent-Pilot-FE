<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Talent Pilot AI agent improvement loop</title>
  <desc id="desc">A controlled loop where an agent run is reviewed by a human, feedback and outcomes are evaluated, a proposal is approved, and a new version is released.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="560" rx="28" fill="#f8fafc"/>
  <rect x="36" y="36" width="1208" height="488" rx="24" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="82" y="96" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#101828">AI agents improve through a governed feedback loop</text>
  <text x="82" y="132" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#667085">AI can find patterns and suggest upgrades, but humans approve changes before production agents use them.</text>

  <path d="M244 258 H386" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M548 258 H690" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M852 258 H994" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1080 334 C1080 448 198 448 198 348" stroke="#64748b" stroke-width="4" stroke-dasharray="12 12" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="82" y="176" width="176" height="164" rx="18" fill="#eef6ff" stroke="#bfdbfe"/>
    <circle cx="118" cy="214" r="18" fill="#2563eb"/>
    <text x="148" y="220" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#1e3a8a">Agent run</text>
    <text x="108" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Draft, rank, parse,</text>
    <text x="108" y="286" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">summarize, or explain</text>
    <text x="108" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">inside guardrails.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="386" y="176" width="176" height="164" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
    <circle cx="422" cy="214" r="18" fill="#16a34a"/>
    <text x="452" y="220" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#166534">Human review</text>
    <text x="412" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">User edits, accepts,</text>
    <text x="412" y="286" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">rejects, rates, or</text>
    <text x="412" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">chooses another action.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="176" width="176" height="164" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="726" cy="214" r="18" fill="#f97316"/>
    <text x="756" y="220" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#9a3412">Evaluator</text>
    <text x="716" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Finds repeated issues</text>
    <text x="716" y="286" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">across prompts, data,</text>
    <text x="716" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">retrieval, and scoring.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="994" y="176" width="204" height="164" rx="18" fill="#f5f3ff" stroke="#ddd6fe"/>
    <circle cx="1030" cy="214" r="18" fill="#7c3aed"/>
    <text x="1060" y="220" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#4c1d95">Approved version</text>
    <text x="1020" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Prompt, rubric, rule,</text>
    <text x="1020" y="286" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">retrieval, or data fix</text>
    <text x="1020" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">released intentionally.</text>
  </g>

  <rect x="82" y="404" width="1116" height="58" rx="16" fill="#f1f5f9" stroke="#dbe3ef"/>
  <text x="110" y="440" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#101828">Rule:</text>
  <text x="160" y="440" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#475467">AI suggests improvements. Humans approve. Backend guardrails still enforce permissions, review, audit, and workflow boundaries.</text>
</svg>
