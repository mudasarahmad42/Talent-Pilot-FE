<div class="admin-modal-backdrop" aria-hidden="true" (click)="close()"></div>
<section class="admin-modal-panel" role="dialog" aria-modal="true" aria-labelledby="skill-dialog-title">
  <header>
    <div>
      <p class="admin-breadcrumb">Configuration</p>
      <h2 id="skill-dialog-title">{{ title() }}</h2>
    </div>
    <button
      type="button"
      class="icon-only-button"
      [attr.aria-label]="closeLabel()"
      (click)="close()"
      [disabled]="saving()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>
  </header>

  <div class="modal-form-grid compact">
    <label class="stitch-field">
      <span>Skill Name</span>
      <input
        placeholder="e.g. Kubernetes"
        aria-label="Skill name"
        [value]="name()"
        (input)="setName($event)"
        [disabled]="saving()"
      />
    </label>

    <label class="stitch-field">
      <span>Category</span>
      <input
        placeholder="e.g. Platform"
        aria-label="Skill category"
        [value]="category()"
        (input)="setCategory($event)"
        [disabled]="saving()"
      />
    </label>

    <label class="stitch-field full-span">
      <span>Aliases</span>
      <textarea
        rows="3"
        placeholder="K8s, Container orchestration"
        aria-label="Skill aliases"
        [value]="aliasesText()"
        (input)="setAliasesText($event)"
        [disabled]="saving()"
      ></textarea>
      <em>Separate aliases with commas.</em>
    </label>

    <label class="stitch-field">
      <span>Status</span>
      <select aria-label="Skill status" [value]="status()" (change)="setStatus($event)" [disabled]="saving()">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </label>
  </div>

  @if (errorMessage()) {
    <p class="modal-error-message">{{ errorMessage() }}</p>
  }

  <footer>
    <button mat-stroked-button type="button" class="stitch-secondary-button" (click)="close()" [disabled]="saving()">
      Cancel
    </button>
    <button mat-flat-button type="button" class="stitch-primary-button" (click)="submit()" [disabled]="!canSubmit()">
      {{ primaryButtonLabel() }}
    </button>
  </footer>
</section>
