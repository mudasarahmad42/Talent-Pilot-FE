<div class="admin-table-toolbar compact">
  <label>
    <span class="material-symbols-outlined" aria-hidden="true">search</span>
    <input
      type="search"
      [placeholder]="searchPlaceholder"
      [attr.aria-label]="searchAriaLabel"
      [value]="search"
      (input)="setSearch($event)"
    />
  </label>
  <label class="page-size-field">
    <span>Rows</span>
    <select [attr.aria-label]="pageSizeAriaLabel" [value]="pageSize" (change)="setPageSize($event)">
      @for (option of pageSizeOptions; track option) {
        <option [value]="option">{{ option }}</option>
      }
    </select>
  </label>
  @if (statusOptions.length > 0) {
    <label class="status-filter-field">
      <span>{{ statusLabel }}</span>
      <select [attr.aria-label]="statusAriaLabel" [value]="status" (change)="setStatus($event)">
        @for (option of statusOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
  }
</div>
